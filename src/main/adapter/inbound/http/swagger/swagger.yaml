basePath: /api
definitions:
  dto.ChangedFieldDto:
    properties:
      after:
        type: string
      before:
        type: string
      field:
        type: string
    type: object
  dto.CreateEmailDto:
    properties:
      email:
        example: ana@example.com
        type: string
      password_hash:
        description: PasswordHash is stored as plaintext, without trimming or hashing.
        example: example-password
        type: string
      user:
        example: Ana
        type: string
    required:
    - email
    - password_hash
    - user
    type: object
  dto.CreateEmployeeDto:
    properties:
      branch_id:
        maximum: 9223372036854776000
        type: integer
      department_id:
        maximum: 9223372036854776000
        type: integer
      email:
        maxLength: 255
        type: string
      emails:
        items:
          type: string
        type: array
      name:
        maxLength: 255
        type: string
      phone:
        maxLength: 20
        type: string
      phones:
        items:
          type: string
        type: array
    required:
    - branch_id
    - department_id
    - name
    type: object
  dto.CreateMachineDto:
    properties:
      asset_number:
        minimum: 0
        type: integer
      employee_id:
        maximum: 9223372036854776000
        type: integer
      employee_ids:
        items:
          type: integer
        type: array
      has_keyboard:
        type: boolean
      has_mouse:
        type: boolean
      machine_condition:
        maxLength: 100
        type: string
      model:
        maxLength: 255
        type: string
      serial_number:
        maxLength: 100
        type: string
      situation:
        maxLength: 100
        type: string
      type:
        maxLength: 100
        type: string
      user:
        maxLength: 255
        type: string
    required:
    - model
    - type
    - user
    type: object
  dto.CreateMonitorDto:
    properties:
      asset_number:
        maximum: 9223372036854776000
        type: integer
      brand:
        maxLength: 100
        type: string
      employee_id:
        maximum: 9223372036854776000
        type: integer
      employee_ids:
        items:
          type: integer
        type: array
      has_monitor:
        type: boolean
      model:
        maxLength: 100
        type: string
      monitor_condition:
        maxLength: 100
        type: string
      serial_number:
        maxLength: 100
        type: string
      situation:
        maxLength: 100
        type: string
    required:
    - model
    type: object
  dto.CreatePhoneDto:
    properties:
      employee_id:
        maximum: 9223372036854776000
        type: integer
      employee_ids:
        items:
          type: integer
        type: array
      equipament:
        maxLength: 100
        type: string
      has_chip:
        type: boolean
      imei:
        description: Required unless equipament is "Só chip" or "Sem chip".
        maxLength: 100
        type: string
      model:
        description: Required unless equipament is "Só chip" or "Sem chip".
        maxLength: 100
        type: string
      serial_number:
        description: Required unless equipament is "Só chip" or "Sem chip".
        maxLength: 100
        type: string
      situation:
        maxLength: 100
        type: string
    type: object
  dto.CreatePrinterDto:
    properties:
      asset_number:
        maximum: 9223372036854776000
        type: integer
      branch_id:
        maximum: 9223372036854776000
        type: integer
      departments_id:
        maximum: 9223372036854776000
        type: integer
      ip:
        type: string
      machine_condition:
        maxLength: 100
        type: string
      model:
        maxLength: 100
        type: string
    required:
    - asset_number
    - branch_id
    - departments_id
    - ip
    - model
    type: object
  dto.DeactivationDto:
    properties:
      deactivated_at:
        type: string
      id:
        type: integer
    type: object
  dto.DeactivationResponseDto:
    properties:
      data:
        $ref: '#/definitions/dto.DeactivationDto'
      status:
        type: string
    type: object
  dto.EmailDto:
    properties:
      created_at:
        example: "2026-01-01T00:00:00Z"
        format: date-time
        type: string
      email:
        example: ana@example.com
        type: string
      id:
        example: 42
        format: int32
        type: integer
      password_hash:
        description: PasswordHash contains the plaintext password as stored in usableEmails.
        example: example-password
        type: string
      user:
        example: Ana
        type: string
    type: object
  dto.EmailListResponseDto:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.EmailDto'
        type: array
      status:
        example: emails retrieved successfully
        type: string
    type: object
  dto.EmailResponseDto:
    properties:
      data:
        $ref: '#/definitions/dto.EmailDto'
      status:
        type: string
    type: object
  dto.InactivePageDto:
    properties:
      next_after:
        type: integer
      records:
        items:
          $ref: '#/definitions/dto.DeactivationDto'
        type: array
    type: object
  dto.InactivePageResponseDto:
    properties:
      data:
        $ref: '#/definitions/dto.InactivePageDto'
      status:
        type: string
    type: object
  dto.RecentChangeDto:
    properties:
      action:
        type: string
      changed_fields:
        items:
          $ref: '#/definitions/dto.ChangedFieldDto'
        type: array
      id:
        type: string
      resource:
        type: string
      resource_id:
        type: integer
      time:
        type: string
      user_id:
        type: string
      user_name:
        type: string
    type: object
  dto.RecentChangesResponseDto:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.RecentChangeDto'
        type: array
      status:
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: suporte@brasilnovo.com
    name: Suporte BNTG
  description: Está é uma API utilizada para controlar os equipamentos de TI.
  title: Asset control API
  version: v0.3.0
paths:
  /changes/recent:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RecentChangesResponseDto'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List the ten most recent inventory updates
      tags:
      - changes
  /emails:
    get:
      description: Retorna todos os registros de usableEmails em ordem crescente de
        ID, incluindo password_hash em texto puro, exatamente como armazenado. Retorna
        data como uma lista vazia quando não houver registros.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EmailListResponseDto'
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
        "504":
          description: Tempo limite da operação no banco de dados
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lista todos os emails
      tags:
      - emails
    post:
      consumes:
      - application/json
      description: Cria um registro em usableEmails com ID int32 e created_at gerados
        pelo servidor. Os campos user, email e password_hash são obrigatórios. A senha
        é armazenada e retornada em texto puro, sem alterações.
      parameters:
      - description: Dados do email
        in: body
        name: email
        required: true
        schema:
          $ref: '#/definitions/dto.CreateEmailDto'
      produces:
      - application/json
      responses:
        "201":
          description: 'Email criado; status: created'
          schema:
            $ref: '#/definitions/dto.EmailResponseDto'
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflito de registro
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor ou IDs esgotados
          schema:
            additionalProperties:
              type: string
            type: object
        "504":
          description: Tempo limite da operação no banco de dados
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria um email
      tags:
      - emails
    put:
      consumes:
      - application/json
      description: Substitui user, email e password_hash do registro indicado pelo
        ID; os três campos são obrigatórios. Preserva id e created_at. A senha é armazenada
        e retornada em texto puro, sem alterações. Não cria registros quando o ID
        não existe.
      parameters:
      - description: ID do email (inteiro positivo de 32 bits)
        format: int32
        in: query
        maximum: 2147483647
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Dados atualizados do email
        in: body
        name: email
        required: true
        schema:
          $ref: '#/definitions/dto.CreateEmailDto'
      produces:
      - application/json
      responses:
        "200":
          description: 'Email atualizado; status: email updated successfully'
          schema:
            $ref: '#/definitions/dto.EmailResponseDto'
        "400":
          description: ID ou dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Email não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflito de registro
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
        "504":
          description: Tempo limite da operação no banco de dados
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Atualiza um email
      tags:
      - emails
  /emails/deactivate:
    post:
      parameters:
      - description: Record ID
        format: int64
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeactivationResponseDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Deactivate an inventory record
      tags:
      - deactivation
  /emails/id:
    get:
      description: Retorna um email de usableEmails pelo ID. O campo password_hash
        retorna a senha em texto puro, exatamente como armazenada.
      parameters:
      - description: ID do email (inteiro positivo de 32 bits)
        format: int32
        in: query
        maximum: 2147483647
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EmailResponseDto'
        "400":
          description: ID inválido ou não informado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Email não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
        "504":
          description: Tempo limite da operação no banco de dados
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Busca email por ID
      tags:
      - emails
  /emails/inactive:
    get:
      parameters:
      - description: Last ID from previous page (default 0)
        format: int64
        in: query
        name: after
        type: integer
      - description: Page size (1-100, default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.InactivePageResponseDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List deactivation history separately from active inventory
      tags:
      - deactivation
  /emails/user:
    get:
      description: Busca parcial pelo campo user, sem diferenciar maiúsculas de minúsculas;
        caracteres especiais são tratados literalmente. Espaços nas extremidades da
        busca são removidos. Retorna o email com menor ID quando houver múltiplos
        resultados. O campo password_hash retorna a senha em texto puro, exatamente
        como armazenada.
      parameters:
      - description: Usuário do email (não pode ser vazio)
        in: query
        name: user
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EmailResponseDto'
        "400":
          description: Usuário não informado ou vazio
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Email não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
        "504":
          description: Tempo limite da operação no banco de dados
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Busca email por usuário
      tags:
      - emails
  /employees:
    get:
      description: Retorna todos os funcionários cadastrados.
      produces:
      - application/json
      responses:
        "200":
          description: Funcionários encontrados com sucesso
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lista todos os funcionários
      tags:
      - employees
    post:
      consumes:
      - application/json
      description: Cria um novo funcionário a partir dos dados enviados no corpo da
        requisição.
      parameters:
      - description: Dados do funcionário
        in: body
        name: employee
        required: true
        schema:
          $ref: '#/definitions/dto.CreateEmployeeDto'
      produces:
      - application/json
      responses:
        "201":
          description: Funcionário criado com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria um novo funcionário
      tags:
      - employees
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um funcionário existente através do ID.
      parameters:
      - description: ID do funcionário
        format: int64
        in: query
        name: id
        required: true
        type: integer
      - description: Dados atualizados do funcionário
        in: body
        name: employee
        required: true
        schema:
          $ref: '#/definitions/dto.CreateEmployeeDto'
      produces:
      - application/json
      responses:
        "200":
          description: Funcionário atualizado com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido ou dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Funcionário não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Atualiza um funcionário
      tags:
      - employees
  /employees/deactivate:
    post:
      parameters:
      - description: Record ID
        format: int64
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeactivationResponseDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Deactivate an inventory record
      tags:
      - deactivation
  /employees/id:
    get:
      description: Busca um funcionário pelo ID informado como query parameter.
      parameters:
      - description: ID do funcionário
        format: int64
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Funcionário encontrado com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido ou não informado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Funcionário não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Busca funcionário por ID
      tags:
      - employees
  /employees/inactive:
    get:
      parameters:
      - description: Last ID from previous page (default 0)
        format: int64
        in: query
        name: after
        type: integer
      - description: Page size (1-100, default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.InactivePageResponseDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List deactivation history separately from active inventory
      tags:
      - deactivation
  /employees/name:
    get:
      description: Busca um funcionário pelo nome informado como query parameter.
      parameters:
      - description: Nome do funcionário
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Funcionário encontrado com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Nome não informado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Funcionário não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Busca funcionário por nome
      tags:
      - employees
  /machines:
    get:
      description: Retorna todas as máquinas cadastradas.
      produces:
      - application/json
      responses:
        "200":
          description: Máquinas encontradas com sucesso
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lista todas as máquinas
      tags:
      - machines
    post:
      consumes:
      - application/json
      description: Cria uma nova máquina a partir dos dados enviados no corpo da requisição.
      parameters:
      - description: Dados da máquina
        in: body
        name: machine
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMachineDto'
      produces:
      - application/json
      responses:
        "201":
          description: Máquina criada com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria uma nova máquina
      tags:
      - machines
    put:
      consumes:
      - application/json
      description: Atualiza os dados de uma máquina existente através do ID informado
        como query parameter.
      parameters:
      - description: ID da máquina
        format: int64
        in: query
        name: id
        required: true
        type: integer
      - description: Dados atualizados da máquina
        in: body
        name: machine
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMachineDto'
      produces:
      - application/json
      responses:
