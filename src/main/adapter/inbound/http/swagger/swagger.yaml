basePath: /api
definitions:
  dto.CreateEmployeeDto:
    properties:
      branch_id:
        type: integer
      department_id:
        type: integer
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - branch_id
    - department_id
    - email
    - name
    type: object
  dto.CreateMachineDto:
    properties:
      asset_number:
        type: integer
      employee_id:
        type: integer
      has_keyboard:
        type: boolean
      has_mouse:
        type: boolean
      machine_condition:
        type: string
      model:
        type: string
      serial_number:
        type: string
      situation:
        type: string
      type:
        type: string
      user:
        type: string
    required:
    - model
    - serial_number
    - type
    - user
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: suporte@brasilnovo.com
    name: Suporte BNTG
  description: Está é uma API utilizada para controlar os equipamentos de TI.
  title: Asset control API
  version: v0.2.0
paths:
  /employees:
    get:
      description: Retorna todos os funcionários cadastrados.
      produces:
      - application/json
      responses:
        "200":
          description: Funcionários encontrados com sucesso
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lista todos os funcionários
      tags:
      - employees
    post:
      consumes:
      - application/json
      description: Cria um novo funcionário a partir dos dados enviados no corpo da
        requisição.
      parameters:
      - description: Dados do funcionário
        in: body
        name: employee
        required: true
        schema:
          $ref: '#/definitions/dto.CreateEmployeeDto'
      produces:
      - application/json
      responses:
        "201":
          description: Funcionário criado com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria um novo funcionário
      tags:
      - employees
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um funcionário existente através do ID.
      parameters:
      - description: ID do funcionário
        format: int64
        in: query
        name: id
        required: true
        type: integer
      - description: Dados atualizados do funcionário
        in: body
        name: employee
        required: true
        schema:
          $ref: '#/definitions/dto.CreateEmployeeDto'
      produces:
      - application/json
      responses:
        "200":
          description: Funcionário atualizado com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido ou dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Funcionário não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Atualiza um funcionário
      tags:
      - employees
  /employees/id:
    get:
      description: Busca um funcionário pelo ID informado como query parameter.
      parameters:
      - description: ID do funcionário
        format: int64
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Funcionário encontrado com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido ou não informado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Funcionário não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Busca funcionário por ID
      tags:
      - employees
  /employees/name:
    get:
      description: Busca um funcionário pelo nome informado como query parameter.
      parameters:
      - description: Nome do funcionário
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Funcionário encontrado com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Nome não informado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Funcionário não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Busca funcionário por nome
      tags:
      - employees
  /machines:
    get:
      description: Retorna todas as máquinas cadastradas.
      produces:
      - application/json
      responses:
        "200":
          description: Máquinas encontradas com sucesso
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lista todas as máquinas
      tags:
      - machines
    post:
      consumes:
      - application/json
      description: Cria uma nova máquina a partir dos dados enviados no corpo da requisição.
      parameters:
      - description: Dados da máquina
        in: body
        name: machine
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMachineDto'
      produces:
      - application/json
      responses:
        "201":
          description: Máquina criada com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria uma nova máquina
      tags:
      - machines
    put:
      consumes:
      - application/json
      description: Atualiza os dados de uma máquina existente através do ID informado
        como query parameter.
      parameters:
      - description: ID da máquina
        format: int64
        in: query
        name: id
        required: true
        type: integer
      - description: Dados atualizados da máquina
        in: body
        name: machine
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMachineDto'
      produces:
      - application/json
      responses:
        "200":
          description: Máquina atualizada com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID ou dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Máquina não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Atualiza uma máquina
      tags:
      - machines
  /machines/employee_id:
    get:
      description: Retorna as máquinas vinculadas ao funcionário informado pelo ID.
      parameters:
      - description: ID do funcionário
        format: int64
        in: query
        name: employee_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Máquinas encontradas com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID do funcionário inválido ou não informado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Nenhuma máquina encontrada para o funcionário
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Busca máquinas por funcionário
      tags:
      - machines
  /machines/id:
    get:
      description: Busca uma máquina pelo ID informado como query parameter.
      parameters:
      - description: ID da máquina
        format: int64
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Máquina encontrada com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido ou não informado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Máquina não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Busca máquina por ID
      tags:
      - machines
swagger: "2.0"
