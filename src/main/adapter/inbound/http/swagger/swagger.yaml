basePath: /api
definitions:
  dto.CreateEmployeeDto:
    properties:
      branch_id:
        type: integer
      department_id:
        type: integer
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - branch_id
    - department_id
    - email
    - name
    type: object
  dto.CreateMachineDto:
    properties:
      asset_number:
        type: integer
      employee_id:
        type: integer
      has_keyboard:
        type: boolean
      has_mouse:
        type: boolean
      machine_condition:
        type: string
      model:
        type: string
      serial_number:
        type: string
      situation:
        type: string
      type:
        type: string
      user:
        type: string
    required:
    - model
    - serial_number
    - type
    - user
    type: object
  dto.CreateMonitorDto:
    properties:
      asset_number:
        type: integer
      brand:
        type: string
      employee_id:
        type: integer
      has_monitor:
        type: boolean
      model:
        type: string
      monitor_condition:
        type: string
      serial_number:
        type: string
      situation:
        type: string
    required:
    - model
    type: object
  dto.CreatePhoneDto:
    properties:
      employee_id:
        type: integer
      equipament:
        type: string
      has_chip:
        type: boolean
      imei:
        type: string
      model:
        type: string
      serial_number:
        type: string
      situation:
        type: string
    required:
    - imei
    - model
    - serial_number
    type: object
  dto.CreatePrinterDto:
    properties:
      asset_number:
        type: integer
      branch_id:
        type: integer
      departments_id:
        type: integer
      ip:
        type: string
      machine_condition:
        type: string
      model:
        type: string
    required:
    - asset_number
    - branch_id
    - departments_id
    - ip
    - model
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: suporte@brasilnovo.com
    name: Suporte BNTG
  description: Está é uma API utilizada para controlar os equipamentos de TI.
  title: Asset control API
  version: v0.2.0
paths:
  /employees:
    get:
      description: Retorna todos os funcionários cadastrados.
      produces:
      - application/json
      responses:
        "200":
          description: Funcionários encontrados com sucesso
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lista todos os funcionários
      tags:
      - employees
    post:
      consumes:
      - application/json
      description: Cria um novo funcionário a partir dos dados enviados no corpo da
        requisição.
      parameters:
      - description: Dados do funcionário
        in: body
        name: employee
        required: true
        schema:
          $ref: '#/definitions/dto.CreateEmployeeDto'
      produces:
      - application/json
      responses:
        "201":
          description: Funcionário criado com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria um novo funcionário
      tags:
      - employees
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um funcionário existente através do ID.
      parameters:
      - description: ID do funcionário
        format: int64
        in: query
        name: id
        required: true
        type: integer
      - description: Dados atualizados do funcionário
        in: body
        name: employee
        required: true
        schema:
          $ref: '#/definitions/dto.CreateEmployeeDto'
      produces:
      - application/json
      responses:
        "200":
          description: Funcionário atualizado com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido ou dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Funcionário não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Atualiza um funcionário
      tags:
      - employees
