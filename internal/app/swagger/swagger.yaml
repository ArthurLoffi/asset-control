      employee_id:
        type: integer
      employee_ids:
        items:
          type: integer
        type: array
      equipament:
        type: string
      has_chip:
        type: boolean
      id:
        type: integer
      imei:
        type: string
      model:
        type: string
      serial_number:
        type: string
      situation:
        type: string
    type: object
  dto.PrinterInputDTO:
    properties:
      asset_number:
        maximum: 9223372036854776000
        type: integer
      branch_id:
        maximum: 9223372036854776000
        type: integer
      departments_id:
        maximum: 9223372036854776000
        type: integer
      ip:
        type: string
      machine_condition:
        maxLength: 100
        type: string
      model:
        maxLength: 100
        type: string
    required:
    - asset_number
    - branch_id
    - departments_id
    - ip
    - model
    type: object
  dto.PrinterResponseDTO:
    properties:
      asset_number:
        type: integer
      branch_id:
        type: integer
      created_at:
        type: string
      departments_id:
        type: integer
      id:
        type: integer
      ip:
        type: string
      machine_condition:
        type: string
      model:
        type: string
    type: object
  exception.ErrorResponse:
    properties:
      code:
        type: string
      logs:
        additionalProperties: {}
        type: object
      message:
        type: string
