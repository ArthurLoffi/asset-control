basePath: /api
definitions:
  dto.BranchResponseDTO:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dto.ChangeResponseDTO:
    properties:
      action:
        type: string
      changed_fields:
        items:
          $ref: '#/definitions/dto.ChangedFieldDTO'
        type: array
      id:
        type: string
      resource:
        type: string
      resource_id:
        type: integer
      time:
        type: string
      user_id:
        type: string
      user_name:
        type: string
    type: object
  dto.ChangedFieldDTO:
    properties:
      after:
        type: string
      before:
        type: string
      field:
        type: string
    type: object
  dto.DeactivationResponseDTO:
    properties:
      deactivated_at:
        type: string
      id:
        type: integer
    type: object
  dto.DepartmentResponseDTO:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dto.EmailInputDTO:
    properties:
      email:
        example: ana@example.com
        type: string
      password_hash:
        description: PasswordHash is stored as plaintext, without trimming or hashing.
        example: example-password
        type: string
      user:
        example: Ana
        type: string
    required:
    - email
    - password_hash
    - user
    type: object
  dto.EmailResponseDTO:
    properties:
      created_at:
        example: "2026-01-01T00:00:00Z"
        format: date-time
        type: string
      email:
        example: ana@example.com
        type: string
      id:
        example: 42
        format: int32
        type: integer
      password_hash:
        description: PasswordHash contains the plaintext password as stored in usableEmails.
        example: example-password
        type: string
      user:
        example: Ana
        type: string
    type: object
  dto.EmployeeInputDTO:
    properties:
      branch_id:
        maximum: 9223372036854776000
        type: integer
      department_id:
        maximum: 9223372036854776000
        type: integer
      email:
        maxLength: 255
        type: string
      emails:
        items:
          type: string
        type: array
      name:
        maxLength: 255
        type: string
      phone:
        maxLength: 20
        type: string
      phones:
        items:
          type: string
        type: array
    required:
    - branch_id
    - department_id
    - name
    type: object
  dto.EmployeeResponseDTO:
    properties:
      branch_id:
        type: integer
      created_at:
        type: string
      department_id:
        type: integer
      email:
        type: string
      emails:
        items:
          type: string
        type: array
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
      phones:
        items:
          type: string
        type: array
    type: object
  dto.MachineInputDTO:
    properties:
      asset_number:
        minimum: 0
        type: integer
      employee_id:
        maximum: 9223372036854776000
        type: integer
      employee_ids:
        items:
          type: integer
        type: array
      has_keyboard:
        type: boolean
      has_mouse:
        type: boolean
      machine_condition:
        maxLength: 100
        type: string
      model:
        maxLength: 255
        type: string
      serial_number:
        maxLength: 100
        type: string
      situation:
        maxLength: 100
        type: string
      type:
        maxLength: 100
        type: string
      user:
        maxLength: 255
        type: string
    required:
    - model
    - type
    - user
    type: object
  dto.MachineResponseDTO:
    properties:
      asset_number:
        type: integer
      created_at:
        type: string
      employee_id:
        type: integer
      employee_ids:
        items:
          type: integer
        type: array
      has_keyboard:
        type: boolean
      has_mouse:
        type: boolean
      id:
        type: integer
      machine_condition:
        type: string
      model:
        type: string
      serial_number:
        type: string
      situation:
        type: string
      type:
        type: string
      user:
        type: string
    type: object
  dto.MonitorInputDTO:
    properties:
      asset_number:
        maximum: 9223372036854776000
        type: integer
      brand:
        maxLength: 100
        type: string
      employee_id:
        maximum: 9223372036854776000
        type: integer
      employee_ids:
        items:
          type: integer
        type: array
      has_monitor:
        type: boolean
      model:
        maxLength: 100
        type: string
      monitor_condition:
        maxLength: 100
        type: string
      serial_number:
        maxLength: 100
        type: string
      situation:
        maxLength: 100
        type: string
    required:
    - model
    type: object
  dto.MonitorResponseDTO:
    properties:
      asset_number:
        type: integer
      brand:
        type: string
      created_at:
        type: string
      employee_id:
        type: integer
      employee_ids:
        items:
          type: integer
        type: array
      has_monitor:
        type: boolean
      id:
        type: integer
      model:
        type: string
      monitor_condition:
        type: string
      serial_number:
        type: string
      situation:
        type: string
    type: object
  dto.PageDoc:
    properties:
      content:
        items: {}
        type: array
      paging:
        $ref: '#/definitions/dto.PagingDTO'
    type: object
  dto.PagingDTO:
    properties:
      has_content:
        type: boolean
      has_next:
        type: boolean
      has_previous:
        type: boolean
      page:
        type: integer
      size:
        type: integer
      total_elements:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.PhoneInputDTO:
    properties:
      employee_id:
        maximum: 9223372036854776000
        type: integer
      employee_ids:
        items:
          type: integer
        type: array
      equipament:
        maxLength: 100
        type: string
      has_chip:
        type: boolean
      imei:
        description: Required unless equipament is "Só chip" or "Sem chip".
        maxLength: 100
        type: string
      model:
        description: Required unless equipament is "Só chip" or "Sem chip".
        maxLength: 100
        type: string
      serial_number:
        description: Required unless equipament is "Só chip" or "Sem chip".
        maxLength: 100
        type: string
      situation:
        maxLength: 100
        type: string
    type: object
  dto.PhoneResponseDTO:
    properties:
